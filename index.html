<!DOCTYPE html>
<html>
<head>
    <title>Interactive 3D Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<button id="backBtn">Back</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

<script>
// --- Scene & Renderer ---
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- Camera & Controls ---
const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.5, 1000);
camera.position.set(0,5,10);
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// --- Lights ---
scene.add(new THREE.AmbientLight(0x504540));
const pointLight = new THREE.PointLight(0xffffee,0.8,8);
pointLight.position.set(0,4,1);
pointLight.castShadow = true;
scene.add(pointLight);
scene.add(new THREE.PointLightHelper(pointLight,0.1));

// --- Sunlight ---
function updateSunlight(){
    const hour = new Date().getHours();
    let color,intensity,pos;
    if(hour>=5 && hour<8){ color=0xffc58f; intensity=0.6; pos=new THREE.Vector3(5,2,5);}
    else if(hour>=8 && hour<16){ color=0xffffff; intensity=1; pos=new THREE.Vector3(10,8,10);}
    else if(hour>=16 && hour<19){ color=0xff9e6b; intensity=0.6; pos=new THREE.Vector3(-5,3,-5);}
    else{ color=0x4a6fa5; intensity=0.2; pos=new THREE.Vector3(0,1,0);}
    if(scene.userData.sunLight) scene.remove(scene.userData.sunLight);
    const sun = new THREE.DirectionalLight(color,intensity);
    sun.position.copy(pos);
    sun.castShadow = true;
    scene.add(sun);
    scene.userData.sunLight = sun;
}
updateSunlight();
setInterval(updateSunlight,300000);

// --- Floor ---
const texFloor = new THREE.TextureLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/rocky_terrain_02_diff_1k.jpg', t=>{
    t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(3,3);
});
const plane = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({map:texFloor}));
plane.rotation.x = -Math.PI/2;
plane.receiveShadow = true;
scene.add(plane);

// --- Sky ---
new THREE.EXRLoader().load(
    'https://raw.githubusercontent.com/Chiratha/ALL_Model/main/citrus_orchard_road_puresky_1k.exr',
    function(texture){ 
        texture.mapping=THREE.EquirectangularReflectionMapping; 
        scene.background=texture; 
        scene.environment=texture; 
    }
);

// --- Global ---
const clock = new THREE.Clock();
let bubbleIsland, manta, whale, tree, mixer;
let leavesMeshes = [];
let mantaDirection = 1;
const mantaSpeed = 0.02, mantaRange=[-2,2], mantaAmplitude=0.5, mantaFrequency=1.0;

// --- Clickable Objects ---
const clickable = [];
function addObj(mesh,pos,name){
    mesh.position.copy(pos);
    mesh.name=name;
    scene.add(mesh);
    clickable.push(mesh);
    return mesh;
}

// --- Load Models ---

// บ้านดอกไม้
new THREE.GLTFLoader().load(
  'https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/house.glb',
  function (gltf) {
    const model = gltf.scene;
    model.position.set(-2.5, 0.0, 3.0);
    model.scale.set(0.5,0.5,0.5);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'house');
  }
);

// BubbleIsland
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/bubble_island.glb', gltf=>{
    bubbleIsland=gltf.scene;
    bubbleIsland.position.set(10,-3.5,-1);
    bubbleIsland.scale.set(0.1,0.1,0.1);
    addObj(bubbleIsland,bubbleIsland.position.clone(),'bubbleisland');
    bubbleIsland.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
});

// Manta Ray
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/manta_ray_birostris_animated.glb', gltf=>{
    manta=gltf.scene;
    manta.position.set(0.5,3.5,-1);
    manta.scale.set(0.25,0.25,0.25);
    manta.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    scene.add(manta);
    mixer = new THREE.AnimationMixer(manta);
    mixer.clipAction(gltf.animations[0]).play();
    addObj(manta, manta.position.clone(), 'manta');
});

// Tree1
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/platano_tree.glb', gltf=>{
    tree = gltf.scene;
    tree.position.set(2,0,-3.5);
    tree.scale.set(0.005,0.005,0.005);
    tree.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; leavesMeshes.push(c); } });
    addObj(tree, tree.position.clone(), 'tree1');
});

// Tree2
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/platano_tree.glb', gltf=>{
    tree = gltf.scene;
    tree.position.set(3.0,0,-3.5);
    tree.scale.set(0.005,0.005,0.005);
    tree.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; leavesMeshes.push(c); } });
    addObj(tree, tree.position.clone(), 'tree2');
});

// Tree3
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/platano_tree.glb', gltf=>{
    tree = gltf.scene;
    tree.position.set(4.0,0,-3.5);
    tree.scale.set(0.005,0.005,0.005);
    tree.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; leavesMeshes.push(c); } });
    addObj(tree, tree.position.clone(), 'tree3');
});

// Me
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model/main/name__1.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(2.4,0.0,2.0);
    model.scale.set(0.5,0.5,0.5);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'me');
});

// Chair
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/chair.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(0.0,0.0,3.0);
    model.scale.set(0.75,0.75,0.75);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'chair');
});

// Chair2
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/chair2.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(2.0,0.0,3.0);
    model.scale.set(0.5,0.5,0.5);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'chair2');
});

// Tree_pink
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/tree_pink.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(-2.5,0,0.0,0.0);
    model.scale.set(0.5,0.5,0.5);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'treepink');
});

// Flower_white
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/flower_white.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(0.0,0.0,0.0);
    model.scale.set(1.0,1.0,1.0);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'flowerwhite');
});

// Cat
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/cat.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(2.0,0.0,3.0);
    model.scale.set(1.0,1.0,1.0);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'cat');
});

// fountain
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/Fountain.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(-2.5,0.0,-2.5);
    model.scale.set(0.5,0.5,0.5);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'fountain');
});

// sign
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/sign2.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(0.0,0.0,0.0);
    model.scale.set(1.0,1.0,1.0);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'sign');
});

// bicycle
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/bicycle.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(0.0,0.0,0.0);
    model.scale.set(1.0,1.0,1.0);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'bicycle');
});

// dog
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/Chiratha/ALL_Model2/main/dog.glb', gltf=>{
    const model=gltf.scene;
    model.position.set(0.0,0.0,0.0);
    model.scale.set(1.0,1.0,1.0);
    model.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
    addObj(model, model.position.clone(), 'dog');
});



// --- Camera Views ---
const VIEWS = { 
    house: { pos:new THREE.Vector3(-2.5, 3, 6), tar:new THREE.Vector3(-2, 0, 3) },
    bubbleisland: { pos:new THREE.Vector3(5 ,5,3), tar:new THREE.Vector3(10,-3.5,-3)},
    tree1: { pos:new THREE.Vector3(4,3,0), tar:new THREE.Vector3(2,0,-3.5)},
    tree2: { pos:new THREE.Vector3(5,3,0), tar:new THREE.Vector3(2.5,0,-3.5)},
    tree3: { pos:new THREE.Vector3(6,3,0), tar:new THREE.Vector3(3.0,0,-3.5)},
    manta: { pos:new THREE.Vector3(0,5,5), tar:new THREE.Vector3(0,3.5,-1)},
    me: { pos:new THREE.Vector3(3.0, 1.0, 7.0), tar:new THREE.Vector3(4.0, -1.0, 4.0)},
    chair: { pos:new THREE.Vector3(0.0, 2.0, 6.0), tar:new THREE.Vector3(-2.0, 0.0, 3.0)},
    flowerwhite: { pos:new THREE.Vector3(0.0, 2.0, 6.0), tar:new THREE.Vector3(0.0, 0.0, 3.0)},
    chair2: { pos:new THREE.Vector3(2.0, 2.0, 6.0), tar:new THREE.Vector3(4.0, 0.0, 3.0)},
    cat: { pos:new THREE.Vector3(0.0, 2.0, 6.0), tar:new THREE.Vector3(5.0, 0.0, -3.0)},
    fountain: { pos:new THREE.Vector3(0.0, 2.0, 6.0), tar:new THREE.Vector3(6.0, 0.0, -3.0)},
    treepink: { pos:new THREE.Vector3(2.0, 2.0, 6.0), tar:new THREE.Vector3(-2.0, 0.0, 3.0)},
    sign: { pos:new THREE.Vector3(-2.5, 3, 6), tar:new THREE.Vector3(-2, 0, -2.5) }  ,
    bicycle: { pos:new THREE.Vector3(0.0, 2.0, 6.0), tar:new THREE.Vector3(0.0, 0.0, 3.0) },
    dog: { pos:new THREE.Vector3(0.0, 2.0, 6.0), tar:new THREE.Vector3(0.0, 0.0, 3.0) } 
};

let pickedObjPosition = new THREE.Vector3(), cameraTargetPosition = camera.position.clone();
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(e){
    const r = renderer.domElement.getBoundingClientRect();
    const x = (e.clientX ?? e.touches[0].clientX) - r.left;
    const y = (e.clientY ?? e.touches[0].clientY) - r.top;
    pointer.x = (x / r.width) * 2 - 1;
    pointer.y = -(y / r.height) * 2 + 1;
}

function onPick(e){
    setPointer(e);
    raycaster.setFromCamera(pointer,camera);
    const hits = raycaster.intersectObjects(clickable,true);
    if(!hits.length) return;
    let obj = hits[0].object;
    while(obj && (!obj.name || !VIEWS[obj.name])) obj = obj.parent;
    if(!obj) return;
    cameraTargetPosition.copy(VIEWS[obj.name].pos);
    pickedObjPosition.copy(VIEWS[obj.name].tar);
}
renderer.domElement.addEventListener('click',onPick);
renderer.domElement.addEventListener('touchend',onPick,{passive:true});

// --- Back Button ---
const initialCamPos = camera.position.clone();
const initialCamTar = new THREE.Vector3(0,1.2,0);
document.getElementById('backBtn').addEventListener('click', ()=>{
    cameraTargetPosition.copy(initialCamPos);
    pickedObjPosition.copy(initialCamTar);
});

// --- Animate Loop ---
function animate(){
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const elapsed = clock.getElapsedTime();
    if(mixer) mixer.update(delta);

    // Manta Ray swimming
    if(manta){
        manta.position.x += mantaSpeed*mantaDirection;
        if(manta.position.x>2 || manta.position.x<-2) mantaDirection*=-1;
        manta.position.y = 3.5 + mantaAmplitude * Math.sin(elapsed*mantaFrequency*Math.PI*0.5);
    }

    // Leaves sway
    leavesMeshes.forEach((leaf,i)=>{ leaf.rotation.z = 0.05 * Math.sin(elapsed*2 + i); });

    // Camera follow
    camera.position.lerp(cameraTargetPosition,0.05);
    controls.target.lerp(pickedObjPosition,0.05);
    controls.update();

    renderer.render(scene,camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
